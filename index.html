<!DOCTYPE html>
<html lang="en">
<head>
    <script>
      (function() {
        var path = window.location.pathname;
        if (!path.endsWith('/')) {
          var base = document.createElement('base');
          base.href = path + '/';
          document.head.prepend(base);
        }
      })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Orbit Friend</title>
</head>
<body>
    Hello Orbit Friend
</body>
</html>
